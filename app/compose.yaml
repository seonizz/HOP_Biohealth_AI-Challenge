name: malssi-personal-demo
services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: malssi
      POSTGRES_USER: malssi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malssi -d malssi"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 9000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:9000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DATABASE_URL: postgresql://malssi:${POSTGRES_PASSWORD:?Run npm run setup first}@postgres:5432/malssi
      CONTENT_KEY: ${CONTENT_KEY:?Run npm run setup first}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-30}
      DEMO_CONTAINER: "true"
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_DOCKER_BASE_URL: ${MODEL_DOCKER_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gemma4:12b}
      MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-0}
      MODEL_REUSE_FINAL_DRAFT: ${MODEL_REUSE_FINAL_DRAFT:-false}
      MODEL_BUNDLE_FINAL_REVIEWS: ${MODEL_BUNDLE_FINAL_REVIEWS:-false}
      MODEL_SHARE_REVIEW_SOURCES: ${MODEL_SHARE_REVIEW_SOURCES:-false}
      MODEL_REPAIR_REVIEW_BUNDLE_TASKS: ${MODEL_REPAIR_REVIEW_BUNDLE_TASKS:-false}
      MODEL_EXTENDED_FINAL_EVIDENCE_IDS: ${MODEL_EXTENDED_FINAL_EVIDENCE_IDS:-false}
      MODEL_BUNDLE_COMBINED_TURN_REVIEWS: ${MODEL_BUNDLE_COMBINED_TURN_REVIEWS:-false}
      MODEL_BUNDLE_ANALYSIS_PLAN: ${MODEL_BUNDLE_ANALYSIS_PLAN:-false}
      MODEL_COMPACT_REVIEW_OUTPUT: ${MODEL_COMPACT_REVIEW_OUTPUT:-false}
      MODEL_REVIEW_COMPACT_REVIEW_OUTPUT: ${MODEL_REVIEW_COMPACT_REVIEW_OUTPUT:-false}
      MODEL_BUNDLE_TURN_REVIEWS: ${MODEL_BUNDLE_TURN_REVIEWS:-false}
      MODEL_REUSE_REVIEWED_NAME: ${MODEL_REUSE_REVIEWED_NAME:-false}
      MODEL_REUSE_REVIEWED_SAFETY: ${MODEL_REUSE_REVIEWED_SAFETY:-false}
      MODEL_STAGE_SCOPED_QUESTION_RULES: ${MODEL_STAGE_SCOPED_QUESTION_RULES:-false}
      MODEL_BLOCK_SCOPED_INPUTS: ${MODEL_BLOCK_SCOPED_INPUTS:-false}
      MODEL_COMPACT_REVIEW_INPUTS: ${MODEL_COMPACT_REVIEW_INPUTS:-false}
      MODEL_SCOPED_QUALITY_REFINEMENT: ${MODEL_SCOPED_QUALITY_REFINEMENT:-false}
      MODEL_REUSE_TOKEN_POLICY: ${MODEL_REUSE_TOKEN_POLICY:-false}
      MODEL_PROTOCOL: ${MODEL_PROTOCOL:-relationship_agent}
      MODEL_STATE_MODE: ${MODEL_STATE_MODE:-combined}
      MODEL_AGENT_FORMAT: ${MODEL_AGENT_FORMAT:-json_schema}
      MODEL_REASONING_EFFORT: ${MODEL_REASONING_EFFORT:-none}
      MODEL_STREAM_JSON: ${MODEL_STREAM_JSON:-false}
      MODEL_STREAM_COMPLETE_JSON: ${MODEL_STREAM_COMPLETE_JSON:-false}
      MODEL_SCHEMA_STRING_LIMITS: ${MODEL_SCHEMA_STRING_LIMITS:-false}
      MODEL_DISCOVER_TOKEN_LIMITS: ${MODEL_DISCOVER_TOKEN_LIMITS-true}
      MODEL_REVIEW_BASE_URL: ${MODEL_REVIEW_BASE_URL:-}
      MODEL_REVIEW_DOCKER_BASE_URL: ${MODEL_REVIEW_DOCKER_BASE_URL:-}
      MODEL_REVIEW_NAME: ${MODEL_REVIEW_NAME-${MODEL_NAME:-gemma4:12b}}
      MODEL_REVIEW_AGENT_FORMAT: ${MODEL_REVIEW_AGENT_FORMAT:-json_schema}
      MODEL_REVIEW_REASONING_EFFORT: ${MODEL_REVIEW_REASONING_EFFORT:-none}
      MODEL_REVIEW_API_KEY: ${MODEL_REVIEW_API_KEY-local-ollama}
      MODEL_REVIEW_STREAM_JSON: ${MODEL_REVIEW_STREAM_JSON:-false}
      MODEL_REVIEW_STREAM_COMPLETE_JSON: ${MODEL_REVIEW_STREAM_COMPLETE_JSON:-false}
      MODEL_REVIEW_SCHEMA_STRING_LIMITS: ${MODEL_REVIEW_SCHEMA_STRING_LIMITS:-false}
      MODEL_REVIEW_DISCOVER_TOKEN_LIMITS: ${MODEL_REVIEW_DISCOVER_TOKEN_LIMITS-true}
      REFERRAL_GUIDANCE_ENABLED: ${REFERRAL_GUIDANCE_ENABLED:-true}
      REFERRAL_COUNTRY: ${REFERRAL_COUNTRY:-}
      REFERRAL_MODEL_BASE_URL: ${REFERRAL_MODEL_BASE_URL:-}
      REFERRAL_MODEL_DOCKER_BASE_URL: ${REFERRAL_MODEL_DOCKER_BASE_URL:-}
      REFERRAL_MODEL_NAME: ${REFERRAL_MODEL_NAME:-}
      REFERRAL_MODEL_API_KEY: ${REFERRAL_MODEL_API_KEY:-}
      REFERRAL_MODEL_AGENT_FORMAT: ${REFERRAL_MODEL_AGENT_FORMAT:-}
      REFERRAL_MODEL_REASONING_EFFORT: ${REFERRAL_MODEL_REASONING_EFFORT:-}
      REFERRAL_MODEL_STREAM_JSON: ${REFERRAL_MODEL_STREAM_JSON:-false}
      REFERRAL_MODEL_STREAM_COMPLETE_JSON: ${REFERRAL_MODEL_STREAM_COMPLETE_JSON:-false}
      REFERRAL_MODEL_DISCOVER_TOKEN_LIMITS: ${REFERRAL_MODEL_DISCOVER_TOKEN_LIMITS-${MODEL_DISCOVER_TOKEN_LIMITS-true}}
    ports:
      - "127.0.0.1:${PORT:-9000}:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:9000/health',{headers:{Host:new URL(process.env.PUBLIC_ORIGIN).host}},r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
