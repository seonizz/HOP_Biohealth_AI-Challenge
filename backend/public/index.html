<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주변인 코칭 · 서버 점검</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; color: #25333b; background: #f5f7f8; color-scheme: light; }
    * { box-sizing: border-box; } body { margin: 0; } button, input, textarea { font: inherit; }
    button { padding: 9px 12px; border: 1px solid #ccd6db; border-radius: 7px; background: white; color: inherit; cursor: pointer; }
    button:hover:not(:disabled) { background: #eef5f3; } button:disabled { opacity: .5; cursor: not-allowed; }
    button.primary { background: #246659; border-color: #246659; color: white; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #7cb2df; outline-offset: 2px; }
    input, textarea { width: 100%; border: 1px solid #ccd6db; border-radius: 7px; padding: 10px; background: white; }
    textarea { resize: vertical; min-height: 100px; line-height: 1.6; }
    h1 { margin: 0 0 6px; font-size: 22px; } h2 { margin: 0 0 12px; font-size: 16px; } h3 { font-size: 14px; margin: 16px 0 6px; }
    header, main { max-width: 1440px; margin: auto; padding: 20px 24px; }
    header { padding-bottom: 12px; } main { padding-top: 0; display: grid; grid-template-columns: 230px minmax(300px, 1fr) 290px; gap: 16px; align-items: start; }
    .muted { color: #647680; font-size: 13px; line-height: 1.6; }
    .health, .panel { border: 1px solid #d8e1e5; border-radius: 9px; background: white; padding: 16px; min-width: 0; }
    .health { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .health-values { display: flex; flex-wrap: wrap; flex: 1; gap: 8px 20px; font-size: 13px; }
    .health-values span { overflow-wrap: anywhere; } .health strong { font-size: 13px; }
    .form-grid, .project-list { display: grid; gap: 8px; } label { display: block; font-size: 13px; margin-bottom: 5px; }
    .project-list { margin-top: 16px; max-height: 52vh; overflow: auto; }
    .project-button { text-align: left; display: grid; gap: 5px; overflow-wrap: anywhere; }
    .project-button[aria-current="true"] { border-color: #246659; background: #edf6f2; }
    .project-button small { color: #647680; }
    .conversation { padding: 0; overflow: hidden; } .conversation-head, .composer { padding: 16px; }
    .conversation-head { border-bottom: 1px solid #e1e8eb; } .conversation-head h2 { margin-bottom: 4px; overflow-wrap: anywhere; }
    .messages { height: min(53vh, 650px); min-height: 300px; padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
    .empty { margin: auto; max-width: 360px; text-align: center; font-size: 14px; color: #647680; line-height: 1.7; }
    .message { max-width: 95%; width: fit-content; border-radius: 9px; padding: 11px 13px; background: #f0f3f5; }
    .message.user { margin-left: auto; background: #e8f3ee; } .message-label { display: block; font-size: 11px; color: #596c76; margin-bottom: 5px; }
    .message-content { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; font-size: 14px; }
    .composer { border-top: 1px solid #e1e8eb; } .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .notice { font-size: 13px; line-height: 1.6; margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .notice.error { color: #a13229; } .notice.success { color: #246659; }
    dl { margin: 12px 0 0; display: grid; gap: 10px; } dl > div { padding-bottom: 8px; border-bottom: 1px solid #edf0f2; }
    dt { font-size: 12px; color: #647680; margin-bottom: 4px; } dd { font-size: 13px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
    details { margin-top: 16px; } summary { font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: 12px; line-height: 1.6; margin: 0; }
    .coaching { border-top: 1px solid #e1e8eb; padding-top: 14px; margin-top: 16px; } .coaching p, .coaching li { font-size: 13px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .coaching ul { padding-left: 20px; } [hidden] { display: none !important; }
    .auth-panel { max-width: 440px; margin: 0 auto 24px; } .auth-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .account { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
    @media (max-width: 1050px) { main { grid-template-columns: 210px minmax(300px, 1fr); } .inspector { grid-column: 1 / -1; } }
    @media (max-width: 650px) { header { padding: 18px 12px 12px; } main { display: flex; flex-direction: column; padding: 0 12px 18px; gap: 12px; } .panel { width: 100%; } .project-list { max-height: 170px; } .messages { height: 45vh; } .health-values { flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <h1>주변인 코칭</h1>
    <div class="muted">인터뷰 → 정보 정리 → 도움말 · Node.js 백엔드 점검 화면</div>
    <section class="health" aria-label="서버와 실제 모델 상태">
      <strong>연결 상태</strong>
      <div class="health-values" aria-live="polite">
        <span>서버: <b id="server-status">확인 중…</b></span>
        <span>모델 준비: <b id="ready-status">확인 중…</b></span>
        <span>모델명: <b id="model-name">미확인</b></span>
        <span>모드: <b id="model-mode">미확인</b></span>
        <span>지식 문서: <b id="knowledge-count">미확인</b></span>
      </div>
      <button id="refresh-health" type="button">상태 새로고침</button>
    </section>
    <div id="health-notice" class="notice" role="status" aria-live="polite"></div>
    <div id="app-notice" class="notice" role="status" aria-live="polite"></div>
    <div id="account" class="account" hidden><span id="account-email" class="muted"></span><button id="logout" type="button">로그아웃</button></div>
  </header>
  <section id="auth-panel" class="panel auth-panel" aria-label="계정 로그인">
    <h2 id="auth-title">로그인</h2>
    <div class="auth-tabs"><button id="login-tab" type="button" class="primary">로그인</button><button id="register-tab" type="button">계정 만들기</button></div>
    <form id="auth-form" class="form-grid">
      <label for="auth-email">이메일</label><input id="auth-email" type="email" autocomplete="username" required>
      <label for="auth-password">비밀번호</label><input id="auth-password" type="password" autocomplete="current-password" required>
      <div id="invite-field" hidden><label for="auth-invite">팀 초대 코드</label><input id="auth-invite" type="password" autocomplete="off"></div>
      <button id="auth-submit" type="submit" class="primary">로그인</button>
    </form>
    <div id="auth-notice" class="notice" role="status" aria-live="polite">로그인 상태를 확인하고 있습니다.</div>
  </section>
  <main id="workspace" hidden>
    <aside class="panel">
      <h2>프로젝트</h2>
      <form id="project-form" class="form-grid">
        <label for="project-title">새 프로젝트 이름</label>
        <input id="project-title" maxlength="80" placeholder="예: 가족과 대화하기" required autocomplete="off">
        <button id="create-project" type="submit" disabled>프로젝트 만들기</button>
      </form>
      <div id="project-list" class="project-list" aria-label="프로젝트 목록"></div>
      <p class="muted">대화와 기억은 로그인한 계정의 프로젝트별로 관리됩니다.</p>
    </aside>
    <section class="panel conversation" aria-label="대화">
      <div class="conversation-head">
        <h2 id="conversation-title">프로젝트를 선택해 주세요</h2>
        <div id="conversation-status" class="muted">프로젝트를 만들면 인터뷰를 시작할 수 있습니다.</div>
        <p id="current-question" class="message-content" hidden></p>
      </div>
      <div id="messages" class="messages" role="log" aria-label="대화 기록" aria-live="polite"></div>
      <form id="message-form" class="composer">
        <label for="message-text">답변 또는 도움이 필요한 상황</label>
        <textarea id="message-text" placeholder="직접 보신 상황이나 전달받은 말을 적어 주세요." disabled></textarea>
        <div class="actions">
          <button id="send-message" class="primary" type="submit" disabled>보내기</button>
          <button id="skip-question" type="button" disabled>질문 건너뛰기</button>
          <button id="coach-now" type="button" disabled>현재 정보로 코칭</button>
          <button id="retry-message" type="button" hidden>전송 다시 시도</button>
          <button id="edit-failed-message" type="button" hidden>입력 수정</button>
        </div>
        <div id="message-notice" class="notice" role="status" aria-live="polite"></div>
      </form>
    </section>
    <aside class="panel inspector">
      <h2>정보 확보 상태</h2>
      <div class="muted">인터뷰 17문항의 답변·건너뛰기 현황입니다.</div>
      <div id="readiness" class="muted">프로젝트를 선택하면 표시됩니다.</div>
      <details><summary>정리된 프로필</summary><pre id="profile">아직 없습니다.</pre></details>
      <section id="coaching" class="coaching" hidden aria-label="최근 코칭 결과"></section>
      <details id="validation-details" hidden><summary>최근 응답 검증 결과</summary><pre id="validation"></pre></details>
    </aside>
  </main>
  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    const state = { user: null, authMode: "login", authBusy: false, projects: [], current: null, initialized: false, loading: false, sending: false, creating: false, selection: 0, messages: new Map(), pending: new Map(), drafts: new Map(), results: new Map() };
    const statuses = { interviewing: "인터뷰 중", coaching: "코칭 중", new: "시작 전", profile_ready: "프로필 준비됨" };
    const readinessLabels = { ready: "코칭에 필요한 정보 확보", answered_count: "답변 문항 수", addressed_count: "처리한 문항 수", total_questions: "전체 문항 수", missing_required_ids: "더 필요한 필수 문항", context_present: "구체적인 상황 확보", basis: "판단 근거" };
    function display(value) { if (value == null) return "미확인"; if (typeof value === "boolean") return value ? "예" : "아니요"; return typeof value === "object" ? JSON.stringify(value, null, 2) : String(value); }
    function notice(id, message, kind = "") { $(id).textContent = message; $(id).className = "notice" + (kind ? " " + kind : ""); }
    class ApiError extends Error {
      constructor(message, status, data = {}) { super(message); this.status = status; this.code = data.code; this.retryable = data.retryable; this.messageSaved = data.message_saved; this.data = data; }
    }
    async function api(path, options = {}) {
      const url = new URL(path, window.location.origin);
      if (url.origin !== window.location.origin) throw new Error("같은 서버의 API만 사용할 수 있습니다.");
      const headers = { Accept: "application/json" };
      if (options.body !== undefined) headers["Content-Type"] = "application/json";
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 180000);
      try {
        const response = await fetch(url, { method: options.method || "GET", headers, body: options.body === undefined ? undefined : JSON.stringify(options.body), credentials: "same-origin", redirect: "error", cache: "no-store", signal: controller.signal });
        const raw = await response.text();
        let data;
        try { data = raw ? JSON.parse(raw) : {}; }
        catch (_) { throw new ApiError("서버가 JSON 응답을 반환하지 않았습니다.", response.status); }
        if (!response.ok) {
          if (response.status === 401 && state.user) showAuthentication("로그인이 만료되었습니다. 다시 로그인해 주세요.");
          throw new ApiError(display(data.detail || data.reason || data.error || "요청을 처리하지 못했습니다."), response.status, data);
        }
        return data;
      } finally { clearTimeout(timeout); }
    }
    function errorText(error) {
      if (error.name === "AbortError") return "응답 대기 시간이 초과되었습니다. 서버에서 처리 중일 수 있으므로 같은 요청으로 다시 시도해 주세요.";
      if (error instanceof TypeError) return "서버에 연결하지 못했습니다. 서버와 네트워크 상태를 확인해 주세요.";
      const prefix = error.status ? "HTTP " + error.status + (error.code ? " · " + display(error.code) : "") + "\n" : "";
      let message = prefix + (error.message || "요청을 처리하지 못했습니다.");
      if (error.messageSaved === false) message += "\n서버 응답: 이 메시지는 저장되지 않았습니다.";
      if (error.retryable === false) message += "\n원인을 해결한 뒤 다시 시도해 주세요.";
      return message;
    }
    async function refreshHealth() {
      $("refresh-health").disabled = true;
      $("server-status").textContent = "확인 중…"; $("ready-status").textContent = "확인 중…";
      notice("health-notice", "");
      const [health, ready] = await Promise.allSettled([api("/health", { public: true }), api("/ready", { public: true })]);
      const errors = [];
      if (health.status === "fulfilled") {
        $("server-status").textContent = "연결됨";
        $("model-name").textContent = display(health.value.model_name); $("model-mode").textContent = display(health.value.model_mode); $("knowledge-count").textContent = display(health.value.knowledge_count);
      } else { $("server-status").textContent = "확인 실패"; $("model-name").textContent = "미확인"; $("model-mode").textContent = "미확인"; $("knowledge-count").textContent = "미확인"; errors.push("/health: " + errorText(health.reason)); }
      if (ready.status === "fulfilled") {
        $("ready-status").textContent = ready.value.ready === true ? "준비됨" : "준비되지 않음";
        if (ready.value.model_name) $("model-name").textContent = display(ready.value.model_name);
        if (ready.value.model_mode) $("model-mode").textContent = display(ready.value.model_mode);
        if (ready.value.reason) errors.push("/ready: " + display(ready.value.reason));
      } else { $("ready-status").textContent = ready.reason.data?.ready === false ? "준비되지 않음" : "확인 실패"; errors.push("/ready: " + errorText(ready.reason)); }
      notice("health-notice", errors.join("\n"), errors.length ? "error" : "");
      $("refresh-health").disabled = false;
    }
    function updateControls() {
      const selected = Boolean(state.current), busy = state.loading || state.sending, pending = selected && state.pending.has(state.current.id);
      $("create-project").disabled = !state.initialized || state.creating || busy;
      $("project-title").disabled = state.creating;
      $("message-text").disabled = !selected || busy || pending;
      $("send-message").disabled = !selected || busy || pending;
      $("skip-question").disabled = !selected || busy || pending || !state.current.pending_question_id;
      $("coach-now").disabled = !selected || busy || pending;
      $("retry-message").hidden = !pending || state.sending; $("retry-message").disabled = busy;
      $("edit-failed-message").hidden = !pending || state.sending; $("edit-failed-message").disabled = busy;
      $("send-message").textContent = state.sending ? "응답 기다리는 중…" : "보내기";
      $("messages").setAttribute("aria-busy", String(busy));
      for (const button of $("project-list").querySelectorAll("button")) button.disabled = state.sending || state.creating;
      $("logout").disabled = state.sending || state.loading || state.creating || state.authBusy;
    }
    function renderProjects() {
      const container = $("project-list"); container.replaceChildren();
      if (!state.projects.length) { const empty = document.createElement("p"); empty.className = "muted"; empty.textContent = "아직 프로젝트가 없습니다."; container.append(empty); }
      for (const project of state.projects) {
        const button = document.createElement("button"); button.type = "button"; button.className = "project-button"; button.setAttribute("aria-current", String(state.current?.id === project.id));
        const title = document.createElement("span"); title.textContent = display(project.title);
        const status = document.createElement("small"); status.textContent = statuses[project.status] || display(project.status);
        button.append(title, status); button.addEventListener("click", () => selectProject(project.id)); container.append(button);
      }
      updateControls();
    }
    function renderMessages() {
      const container = $("messages"); container.replaceChildren();
      const messages = state.current ? state.messages.get(state.current.id) || [] : [];
      if (!messages.length) { const empty = document.createElement("p"); empty.className = "empty"; empty.textContent = state.loading ? "대화를 불러오는 중입니다." : state.current ? "도움이 필요한 상황을 적어 인터뷰를 시작해 주세요." : "왼쪽에서 프로젝트를 만들거나 선택해 주세요."; container.append(empty); }
      for (const message of messages) {
        const article = document.createElement("article"); article.className = "message" + (message.role === "user" ? " user" : "");
        const label = document.createElement("span"); label.className = "message-label"; label.textContent = message.role === "user" ? "사용자" : message.role === "assistant" ? "도움 에이전트" : display(message.role);
        const content = document.createElement("div"); content.className = "message-content"; content.textContent = display(message.content);
        article.append(label, content); container.append(article);
      }
      container.scrollTop = container.scrollHeight;
    }
    function renderReadiness(readiness) {
      const container = $("readiness"); container.replaceChildren();
      if (!readiness || typeof readiness !== "object") { container.textContent = "아직 확보 상태가 없습니다."; return; }
      const list = document.createElement("dl");
      for (const [key, label] of Object.entries(readinessLabels)) {
        if (!(key in readiness)) continue;
        const row = document.createElement("div"), term = document.createElement("dt"), value = document.createElement("dd");
        term.textContent = label; value.textContent = display(readiness[key]); row.append(term, value); list.append(row);
      }
      container.append(list);
    }
    function renderResult() {
      const result = state.current ? state.results.get(state.current.id) : null, container = $("coaching"); container.replaceChildren(); container.hidden = !result?.coaching;
      if (result?.coaching) {
        const heading = document.createElement("h2"); heading.textContent = "최근 코칭"; container.append(heading);
        for (const [key, title] of [["suggested_words", "건넬 수 있는 말"], ["actions", "도움이 되는 행동"], ["avoid", "피하면 좋은 말과 행동"], ["citations", "참고 근거"]]) {
          const value = result.coaching[key]; if (value == null || value === "" || (Array.isArray(value) && !value.length)) continue;
          const subtitle = document.createElement("h3"); subtitle.textContent = title; container.append(subtitle);
          if (Array.isArray(value)) { const list = document.createElement("ul"); for (const item of value) { const line = document.createElement("li"); line.textContent = display(item); list.append(line); } container.append(list); }
          else { const paragraph = document.createElement("p"); paragraph.textContent = display(value); container.append(paragraph); }
        }
      }
      $("validation-details").hidden = result?.validation == null; $("validation").textContent = result?.validation == null ? "" : display(result.validation);
    }
    function renderProject() {
      const project = state.current, question = project ? state.results.get(project.id)?.question : null;
      $("conversation-title").textContent = project ? display(project.title) : "프로젝트를 선택해 주세요";
      $("conversation-status").textContent = project ? (statuses[project.status] || display(project.status)) + (project.pending_question_id ? " · 현재 질문: " + display(project.pending_question_id) : "") : "프로젝트를 만들면 인터뷰를 시작할 수 있습니다.";
      const showQuestion = Boolean(question?.text && question.id === project.pending_question_id);
      $("current-question").hidden = !showQuestion; $("current-question").textContent = showQuestion ? display(question.text) : "";
      $("profile").textContent = project?.profile == null ? "아직 없습니다." : display(project.profile);
      renderReadiness(project?.readiness); renderResult(); renderProjects(); renderMessages(); updateControls();
    }
    function rememberProject(project) { const index = state.projects.findIndex((item) => item.id === project.id); if (index < 0) state.projects.unshift(project); else state.projects[index] = project; }
    async function selectProject(id) {
      if (state.sending || state.creating) return;
      if (state.current) state.drafts.set(state.current.id, $("message-text").value);
      const selection = ++state.selection; state.loading = true;
      state.current = state.projects.find((project) => project.id === id) || { id, title: "불러오는 중", status: "" };
      $("message-text").value = state.pending.get(id)?.text || state.drafts.get(id) || "";
      notice("message-notice", state.pending.has(id) ? "완료 여부를 확인하지 못한 요청이 있습니다. 전송 다시 시도로 같은 요청을 이어갈 수 있습니다." : ""); renderProject();
      try {
        const [project, response] = await Promise.all([api("/api/projects/" + encodeURIComponent(id)), api("/api/projects/" + encodeURIComponent(id) + "/messages")]);
        if (selection !== state.selection) return;
        state.current = project; rememberProject(project); state.messages.set(id, Array.isArray(response) ? response : response.messages || []);
      } catch (error) { if (selection === state.selection) notice("message-notice", errorText(error), "error"); }
      finally { if (selection === state.selection) { state.loading = false; renderProject(); } }
    }
    async function submitMessage(mode = "answer") {
      if (!state.current || state.sending || state.loading) return;
      const projectId = state.current.id;
      let payload = state.pending.get(projectId);
      if (!payload) {
        const text = mode === "skip" ? "" : $("message-text").value.trim();
        if (mode === "answer" && !text) { $("message-text").focus(); return; }
        payload = { request_id: crypto.randomUUID(), text, skip: mode === "skip", coach_now: mode === "coach" }; state.pending.set(projectId, payload);
      }
      state.sending = true; notice("message-notice", "서버의 실제 응답을 기다리고 있습니다."); updateControls();
      try {
        const result = await api("/api/projects/" + encodeURIComponent(projectId) + "/messages", { method: "POST", body: payload });
        state.pending.delete(projectId);
        if (!payload.skip) { state.drafts.delete(projectId); $("message-text").value = ""; }
        if (result.project) { state.current = result.project; rememberProject(result.project); }
        state.results.set(projectId, result);
        const cached = [...(state.messages.get(projectId) || [])];
        if (payload.text) cached.push({ role: "user", content: payload.text });
        const reply = result.reply || result.question?.text; if (reply) cached.push({ role: "assistant", content: reply }); state.messages.set(projectId, cached);
        notice("message-notice", "응답 완료" + (result.model_mode ? " · 모드: " + display(result.model_mode) : ""), "success"); renderProject();
        try { const response = await api("/api/projects/" + encodeURIComponent(projectId) + "/messages"); state.messages.set(projectId, Array.isArray(response) ? response : response.messages || []); }
        catch (_) { notice("message-notice", "응답은 완료되었습니다. 저장된 대화를 다시 불러오지 못해 방금 받은 응답을 표시합니다."); }
      } catch (error) { notice("message-notice", errorText(error) + "\n전송 다시 시도는 같은 요청 ID와 내용을 사용합니다.", "error"); }
      finally { state.sending = false; renderProject(); if (!state.pending.has(projectId)) $("message-text").focus(); }
    }
    $("project-form").addEventListener("submit", async (event) => {
      event.preventDefault(); const title = $("project-title").value.trim(); if (!title || state.creating || state.sending || !state.initialized) return;
      state.creating = true; updateControls(); let created;
      try { const response = await api("/api/projects", { method: "POST", body: { title } }); created = response.project || response; rememberProject(created); $("project-title").value = ""; notice("app-notice", ""); }
      catch (error) { notice("app-notice", errorText(error), "error"); }
      finally { state.creating = false; renderProjects(); }
      if (created) await selectProject(created.id);
    });
    $("message-form").addEventListener("submit", (event) => { event.preventDefault(); submitMessage(); });
    $("skip-question").addEventListener("click", () => submitMessage("skip")); $("coach-now").addEventListener("click", () => submitMessage("coach"));
    $("retry-message").addEventListener("click", () => submitMessage()); $("refresh-health").addEventListener("click", refreshHealth);
    $("edit-failed-message").addEventListener("click", async () => {
      if (!state.current || state.sending || state.loading) return;
      const id = state.current.id, pending = state.pending.get(id); if (!pending) return;
      state.sending = true; updateControls(); notice("message-notice", "서버에 저장된 현재 대화를 확인하고 있습니다.");
      try {
        const [project, response] = await Promise.all([api("/api/projects/" + encodeURIComponent(id)), api("/api/projects/" + encodeURIComponent(id) + "/messages")]);
        if (!state.user) return;
        state.current = project; rememberProject(project); state.messages.set(id, Array.isArray(response) ? response : response.messages || []);
        state.pending.delete(id); state.drafts.set(id, pending.text); $("message-text").value = pending.text;
        notice("message-notice", "서버의 현재 대화를 다시 확인했습니다. 화면의 재시도 요청을 해제했습니다. 내용을 수정해 보내면 새 요청으로 처리됩니다.");
      } catch (error) { notice("message-notice", errorText(error) + "\n현재 상태를 확인하지 못해 기존 요청을 유지합니다.", "error"); }
      finally { state.sending = false; renderProject(); if (!state.pending.has(id)) $("message-text").focus(); }
    });
    $("message-text").addEventListener("input", () => { if (state.current) state.drafts.set(state.current.id, $("message-text").value); });
    function showAuthentication(message = "이메일과 비밀번호로 로그인해 주세요.") {
      state.user = null; state.initialized = false; state.current = null; state.projects = []; state.selection++;
      state.messages.clear(); state.pending.clear(); state.drafts.clear(); state.results.clear();
      state.loading = false; $("message-text").value = "";
      $("workspace").hidden = true; $("account").hidden = true; $("auth-panel").hidden = false; $("account-email").textContent = "";
      notice("auth-notice", message); renderProject();
    }
    function setAuthMode(mode) {
      state.authMode = mode;
      const register = mode === "register";
      $("auth-title").textContent = register ? "계정 만들기" : "로그인";
      $("auth-submit").textContent = register ? "계정 만들기" : "로그인";
      $("login-tab").className = register ? "" : "primary"; $("register-tab").className = register ? "primary" : "";
      $("auth-password").autocomplete = register ? "new-password" : "current-password";
      $("invite-field").hidden = !register; $("auth-invite").required = register;
      notice("auth-notice", register ? "팀에서 안내받은 초대 코드로 계정을 만들 수 있습니다." : "이메일과 비밀번호로 로그인해 주세요.");
    }
    function updateAuthControls() {
      for (const id of ["auth-submit", "login-tab", "register-tab", "auth-email", "auth-password", "auth-invite"]) $(id).disabled = state.authBusy;
    }
    async function initializeAuth() {
      state.authBusy = true; updateAuthControls();
      try {
        const response = await api("/api/auth/me"); const user = response.user || response;
        if (!user || typeof user.email !== "string") throw new Error("로그인한 계정 정보를 확인할 수 없습니다.");
        state.current = null; state.projects = []; state.messages.clear(); state.pending.clear(); state.drafts.clear(); state.results.clear();
        state.user = user; $("auth-panel").hidden = true; $("workspace").hidden = false; $("account").hidden = false; $("account-email").textContent = user.email;
        const projects = await api("/api/projects"); state.projects = Array.isArray(projects) ? projects : projects.projects || []; state.initialized = true; renderProjects();
        if (state.projects.length) await selectProject(state.projects[0].id); else renderProject();
        notice("app-notice", "");
      } catch (error) {
        if (error.status === 401) showAuthentication();
        else { showAuthentication("서버의 로그인 상태를 확인하지 못했습니다."); notice("auth-notice", errorText(error), "error"); }
      } finally { state.authBusy = false; updateAuthControls(); updateControls(); }
    }
    $("login-tab").addEventListener("click", () => setAuthMode("login")); $("register-tab").addEventListener("click", () => setAuthMode("register"));
    $("auth-form").addEventListener("submit", async (event) => {
      event.preventDefault(); if (state.authBusy) return;
      const body = { email: $("auth-email").value.trim(), password: $("auth-password").value };
      if (state.authMode === "register" && $("auth-invite").value.trim()) body.invite_code = $("auth-invite").value.trim();
      state.authBusy = true; updateAuthControls(); notice("auth-notice", "처리 중입니다.");
      try {
        await api("/api/auth/" + state.authMode, { method: "POST", body });
        $("auth-password").value = ""; $("auth-invite").value = "";
        await initializeAuth();
      } catch (error) { notice("auth-notice", errorText(error), "error"); }
      finally { state.authBusy = false; updateAuthControls(); updateControls(); }
    });
    $("logout").addEventListener("click", async () => {
      state.authBusy = true; updateControls();
      try { await api("/api/auth/logout", { method: "POST", body: {} }); showAuthentication("로그아웃되었습니다."); }
      catch (error) { notice("app-notice", errorText(error), "error"); }
      finally { state.authBusy = false; updateAuthControls(); updateControls(); }
    });
    renderMessages(); Promise.allSettled([refreshHealth(), initializeAuth()]);
  </script>
</body>
</html>
