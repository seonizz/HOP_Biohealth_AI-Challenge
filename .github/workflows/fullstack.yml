name: Full stack checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run setup
      - run: docker compose -p malssi-e2e -f compose.yaml -f compose.e2e.yaml --profile model up --build --wait --wait-timeout 180
      - run: npm run test:e2e
      - if: always()
        run: docker compose -p malssi-e2e -f compose.yaml -f compose.e2e.yaml --profile model down --volumes
